[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-and-image-scroll-reader"
version = "1.0.0"
description = "Read a folder of images as one continuous scrolling comic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "FreeSimpleGUI>=5.1",
    "Pillow>=10.0",
    "pypdfium2>=4.0",
    "tkinterdnd2>=0.4.3",
]

[project.optional-dependencies]
qt = ["PySide6>=6.8"]

[project.scripts]
comic-scroll-reader = "comic_scroll_reader.app:main"
comic-scroll-reader-qt = "comic_scroll_reader.qt_app:main"

[tool.setuptools.packages.find]
include = ["comic_scroll_reader*"]

[tool.setuptools.package-data]
comic_scroll_reader = [
    "assets/*.desktop",
    "assets/*.png",
    "assets/*.svg",
    "assets/integrations/**/*",
]
